source: proton-install-core-spec.md
source_sha256: 86e5c794d81f3e39546a8fd6508b05d2df98951c7d5d891a1f24631cc445f5d0
criteria:
  - id: "proton-install-core~1~1"
    text: "WHEN the app resolves the Proton context of a Steam game on Linux, the app SHALL take the prefix from `steamapps/compatdata/<appid>/pfx` inside the Steam library that lists the game in `libraryfolders.vdf`. [Method: upstream builds that path under the Steam root at `src/library.js:123`, and all 18 prefixes on Thor, 14 games and four Proton tool app ids, sit in a library the Steam root does not hold, whose `compatdata` holds Steam's own `0` and an empty `1358800`, per the requirements' survey of prefix locations]"
  - id: "proton-install-core~2~4"
    text: "WHEN the app resolves the Proton context of a Steam game, the app SHALL read the creating build as Annex B defines it from the second line of the prefix's `config_info`, and SHALL leave the context unresolved and name the path where no directory Annex B admits as a creating build contains that line's canonical path."
  - id: "proton-install-core~3~1"
    text: "IF the app cannot read a Steam file or a prefix file it needs for a game's Proton context, THEN the app SHALL leave that context unresolved, keep listing the game, and name the file it could not read."
  - id: "proton-install-core~4~3"
    text: "IF Steam's `CompatToolMapping` names for a game an identifiable tool as Annex B defines, and that tool's directory is not the creating build by canonical path, THEN the app SHALL leave that context unresolved and name both directories."
  - id: "proton-install-core~5~5"
    text: "WHILE a game's Proton context is unresolved as Annex B defines, WHEN an install into that game starts, the app SHALL emit a job event naming the context unresolved with the reason `~3~1`, `~2~4` or `~4~3` names, or naming the game as one Steam does not list, and SHALL carry on placing files in the game folder."
  - id: "proton-install-core~6~1"
    text: "The app SHALL write every file a guarded operation places inside the game folder, and SHALL write no file and no registry value into the game's Proton prefix."
  - id: "proton-install-core~7~1"
    text: "IF a Steam game is a native Linux game as Annex B defines, THEN the app SHALL refuse the install with wording naming it as a native Linux game."
  - id: "proton-install-core~8~2"
    text: "The app SHALL resolve every Proton context through one function that takes a game row and returns the prefix where it is found, the creating build where it is found, and a reason wherever the context is not resolved as Annex B defines."
  - id: "proton-install-core~9~4"
    text: "IF a game's route and API pair, read with the API label in force after any per-executable override, is not listed as allowed in Annex A on every dimension Annex C records for the route surface, the entry's launch-options cell as Annex B defines it included, THEN the app SHALL refuse the install on Linux and name the route, the API label, the bitness and the evidence Annex A records for that pair, or the cell's value and Annex B's pattern where the cell is what fails."
  - id: "proton-install-core~10~7"
    text: "WHEN the app installs a pair listed as allowed in Annex A on Linux, the app SHALL install the build that entry pins, extracting from its archive the placement table's members and no other, and SHALL refuse the install, naming the member, when an extracted member is absent as a regular file or differs from the table's checksum. [Method: requirements D6's fallback, D13 and D15; the build and its SHA-256 are the archive the spike ran, in ADR-005; the extracted set is ADR-007's, the extractor and the member digests ADR-009's; the fetch that brings the archive is criterion 33's]"
  - id: "proton-install-core~11~5"
    text: "WHEN an install of a listed pair has placed the entry's files, the app SHALL emit the job event Annex D records for the copy step, carrying the entry's launch-options cell as Annex B defines it. [Method: the launches of 2026-09-20 without `WINEDLLOVERRIDES`, in ADR-008; Proton's `dxgi=n` override and the prefer-native flag on Wine's `d3dcompiler_47` builtin load the game-folder copies unaided]"
  - id: "proton-install-core~12~3"
    text: "IF any process of the invoking user runs or maps a file that is, by device and inode, a file under the game folder, as the process rows of Annex C define running, mapping and identity, THEN the app SHALL refuse the guarded operation and name the process identifier and the path it matched."
  - id: "proton-install-core~13~1"
    text: "WHEN the app runs the running-game check, the app SHALL read no element of a process's command line other than `argv[0]`. [Method: the spike's two guard runs, recorded in ADR-003]"
  - id: "proton-install-core~14~6"
    text: "WHILE a process of the invoking user is hidden as Annex B defines, WHEN the app runs the running-game check, the app SHALL log the process by identifier, judge it by `argv[0]` alone as Annex B's hidden-process table decides, and refuse the guarded operation, naming the identifier and the path it compared, where that table says refuse. [Method: 20 to 23 hidden processes per spike run and the game's own `argv[0]`, recorded in ADR-003; the table's rows in ADR-011, which supersedes it]"
  - id: "proton-install-core~15~2"
    text: "IF the process root cannot be read as Annex B defines, THEN the app SHALL refuse the guarded operation and name the condition it met."
  - id: "proton-install-core~16~2"
    text: "WHEN the app installs a listed pair on Linux, the app SHALL place Microsoft's `d3dcompiler_47.dll`, taken from the user's copy of upstream's matching Windows release, beside the game's executable at the file version and checksum Annex A records. [Method: requirements D4; Wine's copy in the prefix lacks the `isnan` intrinsic the consumer's shaders call, and the copy the spike placed is the one route 2 drew with]"
  - id: "proton-install-core~17~1"
    text: "IF the user's copy of upstream's matching Windows release does not carry a file the entry needs, THEN the app SHALL refuse the install before it writes any file and name the file that is missing."
  - id: "proton-install-core~18~1"
    text: "IF the game folder already holds files from an earlier install of any route Annex A names, THEN the app SHALL refuse a further install and name the route it found."
  - id: "proton-install-core~32~1"
    text: "IF the host has no `7z` on `PATH` when an install of a listed pair starts, THEN the app SHALL refuse the install before it fetches or writes anything and name the extractor it looked for. [Method: requirements D15 and its seventh dependency; the first entry's archive is a `.7z` and upstream's extractor handles zip only]"
  - id: "proton-install-core~33~3"
    text: "WHEN the app installs a pair listed as allowed in Annex A on Linux, the app SHALL fetch each file Annex A sources from a URL that the cache does not hold at its recorded checksum, drawing no more than its byte count plus one chunk under the deadline Annex D records, refusing and naming the bound where either is passed, and SHALL refuse a fetched body of another checksum before any extractor runs or any file is placed, naming the file and leaving no file of that body under the cache root. [Method: requirements D18; the bound, the deadline, the digest of every body and the cache are ADR-010's, and upstream's shape at `runtime-components.js:54-98` is the alternative it prices]"
  - id: "proton-install-core~19~1"
    text: "WHEN the app replaces an existing file in a game folder on Linux, the app SHALL give the replacement the mode the original carried. [Method: requirements D7, against upstream's fixed `0o666` at `src/core/apply.js:150` and `:257`, which makes a game-folder DLL writable by every user of the machine]"
  - id: "proton-install-core~20~1"
    text: "WHEN the app adds a new file to a game folder on Linux, the app SHALL create it with mode `0644`. [Method: requirements D7, the mode every file the spike placed carries in its placement appendix]"
  - id: "proton-install-core~21~1"
    text: "WHEN the app places a file whose target name exists in the target directory under another case, the app SHALL back up the file it found and write under that file's existing name."
  - id: "proton-install-core~22~2"
    text: "WHEN the app restores a game on Linux, the app SHALL return every file and every directory under the executable folder, other than the install's backup directory, to the checksums and modes recorded before the install. [Method: the SHA-256 manifest the spike's route 2 restore matched twice, after its route 1 restore left `vkd3d-proton.cache` files behind]"
  - id: "proton-install-core~23~3"
    text: "WHEN a restore meets a file or a directory under the executable folder, other than the install's backup directory, that neither the before-install record nor the install's manifest lists, the app SHALL move it into the install's backup directory and name it and its new path in the log."
  - id: "proton-install-core~24~1"
    text: "IF a file the install recorded as placed or replaced is absent when the restore reaches it, THEN the app SHALL keep every backup, report the restore incomplete and name that file."
  - id: "proton-install-core~25~1"
    text: "WHEN the app queries the GPU on Linux, the app SHALL read the name and the driver version from `nvidia-smi --query-gpu=name,driver_version --format=csv,noheader`."
  - id: "proton-install-core~26~1"
    text: "The app SHALL gate no install on Linux on the driver version, and SHALL show wording saying it cannot judge a Linux driver version."
  - id: "proton-install-core~27~1"
    text: "IF `nvidia-smi` is absent or exits non-zero on Linux, THEN the app SHALL show the GPU as unknown and carry the install on."
  - id: "proton-install-core~28~2"
    text: "The app SHALL carry its Linux behaviour in files under `src/linux/`, reached from an upstream file only through a hook Annex D lists, with no other change to an upstream file than the in-place edits Annex D marks."
  - id: "proton-install-core~29~1"
    text: "IF a hook Annex D lists is absent from the upstream file it names, THEN the fork's test suite SHALL fail and name the hook and the file."
  - id: "proton-install-core~30~2"
    text: "WHEN the fork's test suite runs on Linux, the fork's test suite SHALL run every test file upstream's `npm test` runs, SHALL fail when the set of failing upstream tests differs from the set Annex E lists, in either direction, naming each test that differs, and SHALL fail when any test in a `test/linux-*.test.js` file fails. [Method: requirements D12; the six tests and the reason each fails are the survey's C2 run of 2026-09-19, re-run 2026-09-20 on Node v20.20.2]"
  - id: "proton-install-core~31~2"
    text: "WHILE `process.platform` is not `linux`, WHEN an upstream file reaches a hook Annex D marks as replacing upstream code, the app SHALL return from that hook what the code it replaced returned at `24bd2ac` for the same arguments. [Method: charter D1, changes nothing a Windows user sees; the oracle is `git show 24bd2ac:<file>` at the replaced lines, reached in a test by the injectable parameters `install-guards.js:39` and `:89` carry and by a `process` whose `platform` reads `win32` in the `vm` harness for `main.js`]"
